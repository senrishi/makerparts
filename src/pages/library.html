<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Project library · MakerParts</title>
    <script src="../settings/theme.js"></script>
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <a class="brand" href="library.html">▧ MakerParts</a>
        <p class="eyebrow">A HOME FOR YOUR NEXT IDEA</p>
        <button id="new-project" class="primary">＋ New project</button>
        <nav id="projects" aria-label="Projects"></nav>
        <div class="backup">
          <p class="eyebrow">YOUR WORKBENCH, BACKED UP</p>
          <button id="export">Export backup</button
          ><label class="file-button"
            >Import backup<input
              id="import"
              type="file"
              accept="application/json,.json"
          /></label>
          <p class="muted">
            Local to this browser. Export to move your library or keep a backup.
          </p>
        </div>
      </aside>
      <main class="library">
        <header class="library-header">
          <div>
            <p class="eyebrow">PROJECT LIBRARY</p>
            <h1 id="heading">All projects</h1>
            <p id="summary" class="muted"></p>
          </div>
          <button id="add-part" class="primary">＋ Add a part</button>
        </header>
        <div id="totals" class="totals"></div>
        <div class="toolbar">
          <input
            id="search"
            type="search"
            placeholder="Search parts, notes or stores…"
            aria-label="Search parts"
          /><select id="category-filter" aria-label="Filter by category">
            <option value="">All categories</option></select
          ><select id="status-filter" aria-label="Filter by status">
            <option value="">Any status</option>
            <option value="planned">Planned</option>
            <option value="ordered">Ordered</option>
            <option value="received">Received</option></select
          ><button id="rename-project" hidden>Rename project</button
          ><button id="delete-project" hidden>Delete project</button>
        </div>
        <p id="message" role="status" aria-live="polite"></p>
        <div id="parts"></div>
      </main>
    </div>
    <dialog id="editor">
      <div class="dialog-heading">
        <h2 id="editor-title">Add a part</h2>
        <button id="close-editor" aria-label="Close dialog">✕</button>
      </div>
      <div id="form-root"></div>
    </dialog>
    <dialog id="project-dialog">
      <form id="project-form">
        <h2 id="project-title">New project</h2>
        <label
          >Project name<input
            id="project-name"
            required
            maxlength="100"
            placeholder="e.g. Desktop weather station"
        /></label>
        <p id="project-error" role="alert"></p>
        <div class="actions">
          <button type="button" id="cancel-project">Cancel</button
          ><button class="primary">Save project</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="library.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Settings · MakerParts</title>
    <script src="../settings/theme.js"></script>
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body>
    <main class="settings-page">
      <header>
        <a class="brand" href="library.html">▧ MakerParts</a
        ><a href="library.html">Project library</a>
      </header>
      <h1>Settings</h1>

      <section class="settings-card appearance-card">
        <h2>Appearance</h2>
        <select aria-label="Theme" data-theme-picker>
          <option value="system">System theme</option>
          <option value="light">Light mode</option>
          <option value="dark">Dark mode</option>
        </select>
      </section>
      <section class="settings-card">
        <h2>This device</h2>
        <form id="device-settings" class="device-form">
          <label
            >Device name
            <input
              id="device-name"
              maxlength="48"
              autocomplete="off"
              placeholder="Automatic"
            />
          </label>
          <button type="submit">Save name</button>
        </form>
        <p id="device-feedback" role="status"></p>
      </section>
      <section id="sync" class="settings-card">
        <div class="sync-heading">
          <h2>Cloud sync</h2>
          <span id="sync-status" class="sync-status-tag" role="status"
            >Checking sync…</span
          >
        </div>
        <p id="sync-intro" class="muted">
          Sync saved projects and parts through Supabase.
        </p>
        <div
          id="sync-notice"
          class="sync-notice"
          role="status"
          aria-atomic="true"
        >
          <strong id="sync-notice-title"></strong>
          <span id="sync-notice-detail"></span>
        </div>
        <form id="sync-login" hidden>
          <label
            >Email<input
              name="email"
              type="email"
              autocomplete="username"
              required
          /></label>
          <label
            >Password<input
              name="password"
              type="password"
              autocomplete="current-password"
              required
          /></label>
          <button class="primary">Sign in and enable sync</button>
        </form>
        <div id="sync-controls" class="sync-account-row" hidden>
          <div class="sync-account-info">
            <p id="sync-account"></p>
          </div>
          <div class="sync-buttons">
            <button class="primary" data-action="cloudSync">Sync now</button>
            <button data-action="cloudLogout">Sign out</button>
          </div>
        </div>
      </section>
      <section class="settings-card">
        <h2>Backup data</h2>
        <div class="actions">
          <button id="export-backup">Export backup</button>
          <button id="choose-backup">Import backup</button>
          <input
            id="import-backup"
            type="file"
            accept=".json,application/json"
            hidden
          />
        </div>
        <p id="backup-status" role="status"></p>
      </section>
    </main>
    <script type="module" src="backup-settings.js"></script>
    <script type="module" src="sync-settings.js"></script>
    <script type="module" src="device-settings.js"></script>
  </body>
</html>
